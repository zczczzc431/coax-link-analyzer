name: Offline validation
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  software:
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Audit public package
        run: python3 tools/audit_release.py
      - name: Run offline C regressions
        run: python3 tools/build.py test
      - name: Compile Linux application (do not run)
        if: ${{ !cancelled() }}
        run: python3 tools/build.py app
      - name: Install ARM compiler and RTL simulator
        if: ${{ !cancelled() }}
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends gcc-arm-linux-gnueabihf libc6-dev-armhf-cross iverilog
      - name: Cross-compile ARM application (do not run)
        if: ${{ !cancelled() }}
        run: python3 tools/build.py app --cc arm-linux-gnueabihf-gcc
      - name: Check ADC elaboration and DAC reference simulation
        if: ${{ !cancelled() }}
        run: python3 tools/build.py rtl-test
